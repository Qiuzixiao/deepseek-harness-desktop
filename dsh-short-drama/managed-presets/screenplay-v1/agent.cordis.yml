# Managed copy of the screenplay-v1 composition. Keep it aligned with the
# desktop preset; project scope lives in the agent.
# Web disables the base filesystem rows while moving model-facing tools behind
# agent presets. Every project file uses the ordinary filesystem tools.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    allowMutations: true

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: screenplay-agent
  name: dsh-short-drama/agent

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
