# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
# The current Web shell installs the slot renderer through its shell-owned
# app-shell entry. Older installed Web bundles still contribute ui-renderer;
# disable that legacy installer when the mixed profile is composed so the
# renderer is installed exactly once.
- id: ui-renderer
  disabled: true

# Zenwit owns the root shell and mounts the native sidebar settings owner in a
# hidden host. Keep ui-layout's service/theme presenter, but release AppFrame's
# root declaration so it cannot collide with Zenwit's sidebar child seat.
- id: ui-layout
  config:
    zenwit: true
