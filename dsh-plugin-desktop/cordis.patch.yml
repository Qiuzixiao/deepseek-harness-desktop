# Desktop Host operations compose around the existing Web bundle. The product
# opens in the enhanced shell while compatibility remains available in config.
- insert:
    # General document intake: paperclip, drag/drop, paste, attachment cards,
    # and the canonical file_path-based read_document tool.
    - id: file-upload
      name: dsh-file-upload
      config:
        uploadMaxBytes: 104857600
        allowedExtensions: []
        uploadTtlMs: 604800000
        sweepIntervalMs: 3600000
        maxConcurrentUploads: 4
        maxFileBytes: 104857600
        readLimit: 2000
        sheetRowLimit: 200
        maxSheets: 5
        cacheEntries: 16
        cacheMaxBytes: 67108864
        markitdownBin: ''
        markitdownTimeoutMs: 120000
        allowRemoteVision: false
    # Agent-independent Skill authoring: /skill-create entrypoint, standardized
    # skill inspection/install/source-reading tools, and the Skill-only source scope guard.
    - id: skill-authoring
      name: dsh-skill-authoring
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: advanced
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
      # Profile recovery remains launcher-owned; ordinary users do not switch it.
      disabled: true
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# Zenwit: every session starts in the general-purpose short-drama preset. The
# preset itself is a normal Harness Agent; other Agent presets can be selected
# per session without changing the workspace shell.
- id: agent-presets
  config:
    default: short-drama

# The current Web shell installs the slot renderer through its shell-owned
# app-shell entry. Older installed Web bundles still contribute ui-renderer;
# disable that legacy installer when the mixed profile is composed so the
# renderer is installed exactly once.
- id: ui-renderer
  disabled: true

# The Desktop conversation keeps the Chat view as its primary surface. The
# trajectory ledger remains available to profiles that explicitly enable the
# upstream plugin, but is not mounted in the Desktop workbench by default.
- id: ui-trajectory
  disabled: true

# Zenwit owns the root shell. Keep ui-layout's service/theme presenter, but
# release AppFrame's root declaration so it cannot collide with Zenwit's
# conversation seat.
- id: ui-layout
  config:
    zenwit: true

# Legacy user-profile plugins built against the previous Harness client ABI
# must not enter the fixed Zenwit renderer graph.
- id: drop-to-path
  disabled: true
- id: rich-file-reader
  disabled: true
- id: better-sidebar
  disabled: true
- id: checkpoint-rewind
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
