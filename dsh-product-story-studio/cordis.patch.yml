# Story Studio's product layer. Third-party code is pinned in package.json and
# shipped inside the desktop installer; no runtime download is performed.
- id: desktop-shell
  config:
    mode: advanced
- insert:
    - id: story-studio-workbench
      name: dsh-product-story-studio
    - id: drop-to-path
      name: '@dsh-external/dsh-drop-to-path'
    - id: rich-file-reader
      name: dsh-rich-file-reader
    - id: checkpoint-rewind
      name: dsh-checkpoint-rewind
      config:
        enabled: true
        provider: auto
        confirmVia: auto
        autoCheckpoint:
          enabled: false
          intervalMinutes: 0
        workspaceRestore: restore
